name: "📊 VN-Index Quarterly Scoring"

on:
  # Chạy tự động đầu mỗi quý (01/01, 01/04, 01/07, 01/10 lúc 02:00 UTC = 09:00 ICT)
  schedule:
    - cron: "0 2 1 1,4,7,10 *"

  # Cho phép chạy thủ công
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quý cần phân tích (YYYY-QN)"
        required: true
        default: "2026-Q3"
      ftse_status:
        description: "FTSE upgrade status"
        required: false
        default: "confirmed"
        type: choice
        options:
          - pending
          - confirmed
          - completed
      skip_ml:
        description: "Skip ML (nhanh hơn)"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  quarterly-scoring:
    name: "Run Q${{ github.event.inputs.quarter || 'Auto' }} Scoring Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: "📁 Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: "📦 Install dependencies"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Determine quarter ───────────────────────────────────────────────
      - name: "📅 Determine quarter"
        id: set-quarter
        run: |
          if [ -n "${{ github.event.inputs.quarter }}" ]; then
            QUARTER="${{ github.event.inputs.quarter }}"
          else
            MONTH=$(date +%-m)
            YEAR=$(date +%Y)
            if [ $MONTH -le 3 ]; then Q=Q1
            elif [ $MONTH -le 6 ]; then Q=Q2
            elif [ $MONTH -le 9 ]; then Q=Q3
            else Q=Q4; fi
            QUARTER="${YEAR}-${Q}"
          fi
          echo "quarter=$QUARTER" >> $GITHUB_OUTPUT
          echo "Quarter: $QUARTER"

      # ── 5. Run quarterly pipeline ──────────────────────────────────────────
      - name: "🚀 Run quarterly scoring pipeline"
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          QUARTER="${{ steps.set-quarter.outputs.quarter }}"
          FTSE_STATUS="${{ github.event.inputs.ftse_status || 'confirmed' }}"
          SKIP_ML="${{ github.event.inputs.skip_ml || 'false' }}"

          CMD="python run_quarterly.py --quarter $QUARTER --ftse-status $FTSE_STATUS"
          if [ "$SKIP_ML" = "true" ]; then
            CMD="$CMD --skip-ml"
          fi
          echo "Running: $CMD"
          $CMD

      # ── 6. Upload artifacts ────────────────────────────────────────────────
      - name: "📤 Upload HTML report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "quarterly-report-${{ steps.set-quarter.outputs.quarter }}"
          path: |
            output/reports/
            output/exports/
            logs/
          retention-days: 90

      # ── 7. Commit scores to repo ───────────────────────────────────────────
      - name: "💾 Commit quarterly scores history"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: quarterly score ${{ steps.set-quarter.outputs.quarter }}"
          file_pattern: |
            data/scores/*.parquet
            output/reports/**/*.html
            output/exports/*.json
          commit_author: "GitHub Actions <actions@github.com>"

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: "📋 Job summary"
        if: always()
        run: |
          echo "## VN-Index Quarterly Scoring — ${{ steps.set-quarter.outputs.quarter }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Pipeline completed. Check artifacts for HTML report and JSON export." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/exports/score_$(echo ${{ steps.set-quarter.outputs.quarter }} | tr '-' '_').json" ]; then
            SCORE=$(python -c "
          import json
          with open('output/exports/score_$(echo ${{ steps.set-quarter.outputs.quarter }} | tr '-' '_').json') as f:
              d = json.load(f)
          qs = d.get('quarterly_score', {})
          print(f\"**Total Score**: {qs.get('total_score', 'N/A')}/100\")
          print(f\"**Label**: {qs.get('emoji', '')} {qs.get('label', 'N/A')}\")
          print(f\"**Leading Indicator**: {qs.get('leading_indicator', 'N/A')}\")
          " 2>/dev/null || echo "Score data not available")
            echo "$SCORE" >> $GITHUB_STEP_SUMMARY
          fi
