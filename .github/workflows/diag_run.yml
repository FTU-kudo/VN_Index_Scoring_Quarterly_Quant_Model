name: "🔬 Diagnostic single-quarter run (temporary)"

on:
  push:
    branches:
      - "arena/01a0e497-vn-index-scoring-quarterly-qua"
    paths:
      - ".github/workflows/diag_run.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Install"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Run ONE quarter + collect evidence"
        if: always()
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          PYTHONUTF8: 1
        run: |
          set +e
          python run_quarterly.py --quarter 2021-Q1 --ftse-status auto > /tmp/diag_stdout.log 2>&1
          echo "EXIT_CODE=$?" > diag_evidence.txt
          {
            echo "===== git status --porcelain ====="
            git status --porcelain
            echo ""
            echo "===== ls -la output/exports (top 10 by mtime) ====="
            ls -lat output/exports/ | head -12
            echo ""
            echo "===== score_2021_Q1.json generated_at + total_score ====="
            python -c "import json; d=json.load(open('output/exports/score_2021_Q1.json')); print(d['metadata']['generated_at'], d['quarterly_score']['total_score'], '| data_as_of:', d['quarterly_score'].get('data_as_of'))" 2>&1
            echo ""
            echo "===== tail 120 stdout ====="
            tail -120 /tmp/diag_stdout.log
          } >> diag_evidence.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f diag_evidence.txt
          git commit -m "debug: diagnostic single-quarter evidence [skip ci]"
          git push
