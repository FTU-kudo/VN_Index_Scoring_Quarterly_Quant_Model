name: "🔁 Batch Rerun 24Q (arena working branch — temporary)"

# WORKFLOW TẠM THỜI (retrigger #3): chạy lại 24 quý bằng code đã fix.
# Dùng git add/commit thuần vì git-auto-commit-action bỏ sót file_pattern
# nhiều dòng (chỉ commit được parquet, bỏ qua toàn bộ HTML/JSON).

on:
  push:
    branches:
      - "arena/01a0e497-vn-index-scoring-quarterly-qua"
    paths:
      - ".github/workflows/batch_rerun_arena.yml"

env:
  PYTHON_VERSION: "3.11"

jobs:
  batch-rerun:
    name: "Rerun 2021-Q1 → 2026-Q4 (fixed code)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: "📁 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install dependencies"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🚀 Run Batch Pipeline (2021-2026)"
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          PYTHONUTF8: 1
        run: |
          set +e
          for YEAR in $(seq 2021 2026); do
            for Q in 1 2 3 4; do
              QUARTER="${YEAR}-Q${Q}"
              echo "=== Running $QUARTER ==="
              python run_quarterly.py --quarter $QUARTER --ftse-status auto 2>&1 | tail -20
              EXIT_CODE=${PIPESTATUS[0]}
              if [ $EXIT_CODE -ne 0 ]; then
                echo "::error::❌ FAILED $QUARTER (exit $EXIT_CODE)"
                echo "FAILED: $QUARTER" >> /tmp/batch_failures.txt
              else
                echo "✅ OK $QUARTER"
              fi
            done
          done
          if [ -f /tmp/batch_failures.txt ]; then
            cat /tmp/batch_failures.txt
            exit 1
          fi

      - name: "💾 Commit regenerated outputs (plain git — reliable)"
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/scores output/reports output/exports README.md
          git status --short | head -40
          git commit -m "chore: regenerate 24Q scores + reports (point-in-time + predictive MLR)"
          git push
