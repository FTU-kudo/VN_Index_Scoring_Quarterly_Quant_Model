<body style="font-family: Arial, sans-serif; padding: 40px; text-align: center;">
  <p>Redirecting to the latest report (2026/Q4)...</p>
  <p>If you are not redirected automatically, please <a href="2026_Q4/index.html">click here</a>.</p>

  <script>
    // Inject VN-Index dataset
    if (typeof window !== 'undefined' && window.chartDataLine && window.chartDataLine.datasets) {
        if (window.chartDataLine.datasets.length === 1) {
            window.chartDataLine.datasets.push({
                label: 'VN-Index',
                data: [1191.44, 1408.55, 1342.06, 1498.28, 1492.15, 1197.6, 1132.11, 1007.09, 1064.64, 1120.18, 1154.15, 1129.93, 1284.09, 1245.32, 1287.94, 1266.78, 1306.86, 1376.07, 1661.7, 1784.49, 1674.49, 1860.01, 1816.93, 1816.93],
                borderColor: '#64748b',
                backgroundColor: 'transparent',
                borderWidth: 2,
                pointRadius: 3,
                borderDash: [5, 3],
                tension: 0.25,
                order: 2,
                pointHoverRadius: 4,
                yAxisID: 'y1',
                hidden: true
            });
        }
    }
    
    // Toggle VN-Index logic
    const toggle = document.getElementById('toggleVNIndex');
    if (toggle) {
        toggle.addEventListener('change', function(e) {
            if (typeof lineChartInstance !== 'undefined' && lineChartInstance) {
                const isChecked = e.target.checked;
                if (lineChartInstance.data.datasets.length > 1) {
                    lineChartInstance.data.datasets[1].hidden = !isChecked;
                    lineChartInstance.options.scales.y1.display = isChecked;
                    lineChartInstance.update();
                }
            }
        });
    }
  </script>
</body>
